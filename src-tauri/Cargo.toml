[package]
name = "MQTTStudio"
version = "1.0.0"
description = "A professional developer-first desktop IDE for MQTT testing and automation"
authors = ["HaiTran"]
edition = "2021"


[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rumqttc = { version = "0.24", features = ["use-rustls"] }
parking_lot = "0.12"
hex = "0.4"
